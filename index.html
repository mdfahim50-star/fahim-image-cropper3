<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucid Glass Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <style>
        /* Apple Mint Green Liquid Glass Vibe */
        .liquid-glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.15) 100%);
            backdrop-filter: blur(50px) saturate(200%);
            -webkit-backdrop-filter: blur(50px) saturate(200%);
            border-top: 1.5px solid rgba(255, 255, 255, 0.9);
            border-left: 1.5px solid rgba(255, 255, 255, 0.8);
            border-right: 1px solid rgba(255, 255, 255, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.15), 
                        inset 0 2px 4px rgba(255, 255, 255, 0.9),
                        inset 0 -2px 6px rgba(0, 0, 0, 0.05);
        }

        .liquid-btn {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.25) 100%);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.06), 
                        inset 0 1px 2px rgba(255, 255, 255, 0.9);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            color: #064e3b;
        }

        .liquid-btn:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.4) 100%);
            border-color: rgba(255, 255, 255, 1);
            box-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.1), 
                        inset 0 2px 4px rgba(255, 255, 255, 1);
            transform: translateY(-2px);
        }

        /* Halka Green & Mint Mesh Background */
        body {
            background: radial-gradient(circle at 15% 20%, #10b981 0%, transparent 40%),
                        radial-gradient(circle at 85% 30%, #059669 0%, transparent 45%),
                        radial-gradient(circle at 50% 85%, #047857 0%, transparent 50%),
                        #022c22;
            background-attachment: fixed;
            background-size: cover;
            min-height: 100vh;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 sm:p-6 font-sans">

    <div class="liquid-glass w-full max-w-3xl rounded-[3rem] p-6 sm:p-10 flex flex-col items-center">
        
        <h1 class="text-3xl sm:text-4xl font-bold mb-1 tracking-tight text-white drop-shadow-md text-center">
            Lucid Glass Studio
        </h1>
        <p class="text-xs text-emerald-100/90 mb-8 text-center font-medium tracking-wider uppercase">
            Made by Fahim
        </p>

        <!-- Upload Box -->
        <div id="upload-box" class="w-full flex flex-col items-center justify-center border-2 border-dashed border-white/40 rounded-3xl p-10 sm:p-14 transition hover:border-white/80 cursor-pointer liquid-btn text-center group">
            <div class="w-16 h-16 rounded-2xl bg-white/50 shadow-inner border border-white flex items-center justify-center mb-4 group-hover:scale-110 transition duration-300">
                <svg class="w-8 h-8 text-emerald-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                </svg>
            </div>
            <span class="text-sm sm:text-base font-bold text-emerald-950">Drop or Upload Image</span>
            <span class="text-xs text-emerald-900/80 mt-1">Supports PNG, JPG, WEBP</span>
            <input type="file" id="fileInput" accept="image/*" class="hidden">
        </div>

        <!-- Editor Workspace -->
        <div id="editor-area" class="w-full hidden flex flex-col items-center">
            <div class="w-full max-h-[55vh] overflow-hidden rounded-3xl mb-6 bg-emerald-950/20 border border-white/30 flex items-center justify-center p-2 backdrop-blur-xl shadow-2xl">
                <img id="previewImage" class="max-w-full block rounded-2xl">
            </div>

            <div class="flex flex-wrap gap-3 justify-center mb-6 w-full">
                <button onclick="cropper.rotate(90)" class="liquid-btn px-4 py-2.5 rounded-2xl text-xs sm:text-sm font-bold">Rotate</button>
                <button onclick="cropper.scaleX(-cropper.getData().scaleX || -1)" class="liquid-btn px-4 py-2.5 rounded-2xl text-xs sm:text-sm font-bold">Flip X</button>
                <button onclick="cropper.scaleY(-cropper.getData().scaleY || -1)" class="liquid-btn px-4 py-2.5 rounded-2xl text-xs sm:text-sm font-bold">Flip Y</button>
                <button onclick="cropper.reset()" class="liquid-btn px-4 py-2.5 rounded-2xl text-xs sm:text-sm font-bold text-rose-800">Reset</button>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 w-full">
                <button id="downloadBtn" class="flex-1 py-3.5 bg-white/90 hover:bg-white text-emerald-950 font-bold rounded-2xl shadow-xl backdrop-blur-2xl transition-all text-sm text-center border border-white">
                    Download Cropped Image
                </button>
                <button onclick="location.reload()" class="px-6 py-3.5 liquid-btn text-sm rounded-2xl font-bold text-emerald-950">
                    New Image
                </button>
            </div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadBox = document.getElementById('upload-box');
        const editorArea = document.getElementById('editor-area');
        const previewImage = document.getElementById('previewImage');
        const downloadBtn = document.getElementById('downloadBtn');
        let cropper = null;

        uploadBox.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files && files.length > 0) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    previewImage.src = event.target.result;
                    uploadBox.classList.add('hidden');
                    editorArea.classList.remove('hidden');

                    if (cropper) cropper.destroy();

                    cropper = new Cropper(previewImage, {
                        aspectRatio: NaN,
                        viewMode: 1,
                        background: false,
                        autoCropArea: 0.85,
                    });
                };
                reader.readAsDataURL(files[0]);
            }
        });

        downloadBtn.addEventListener('click', () => {
            if (cropper) {
                const canvas = cropper.getCroppedCanvas();
                if (canvas) {
                    const link = document.createElement('a');
                    link.download = 'lucid-glass-cropped.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }
            }
        });
    </script>
</body>
  </html>
